name: Atualizar dashboard

# Roda todo dia às 07:00 (Brasília) e também manualmente ou quando o código do dashboard muda.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "scripts/**"
      - "wrangler.toml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados do Meta (Ads + orgânico)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID || '1505849358224649' }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '1352598281263785' }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID || '17841427850880700' }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v23.0' }}
          OUT_DIR: public/data
        run: python scripts/fetch_meta.py

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.131.1 pages deploy public
          --project-name "${{ vars.CF_PAGES_PROJECT || 'lapidation-dashboard' }}"
          --branch main
          --commit-dirty=true

      - name: Resumo
        if: always()
        run: |
          echo "### Dashboard Lapidation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f public/data/meta.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("public/data/meta.json", encoding="utf-8"))
          print(f"- Gerado em: {m.get('generated_at')}")
          print(f"- Campanhas: {len(m.get('campaigns', []))} · Anúncios: {len(m.get('ads', []))} · Linhas diárias: {len(m.get('daily', []))}")
          for w in m.get("warnings", []):
              print(f"- ⚠️ {w}")
          PY
          else
            echo "- Coleta falhou (meta.json não gerado)" >> "$GITHUB_STEP_SUMMARY"
          fi
